<style>
/* ════════════════════════ DESIGN TOKENS ════════════════════════ */
:root{
  /* Neutral scale — 12 pure steps, no tinted grays anywhere. */
  --n-0:#000000; --n-100:#0a0a0a; --n-200:#161616; --n-300:#232323;
  --n-400:#3a3a3a; --n-500:#575757; --n-600:#767676; --n-700:#9c9c9c;
  --n-800:#c4c4c4; --n-900:#e3e3e3; --n-950:#f2f2f2; --n-1000:#ffffff;
  --font-ui:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Plus Jakarta Sans','Noto Sans Devanagari','Inter',system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-full:999px;
  --ease-spring:cubic-bezier(.2,.8,.2,1);
  --ease-overshoot:cubic-bezier(.34,1.35,.5,1);
  --d1:180ms; --d2:300ms; --d3:450ms;
  --shadow-1:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05);
  --shadow-2:0 4px 14px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.05);
  --shadow-3:0 14px 44px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.08);
}
/* Light: white + very light gray. Dark: true OLED black. */
html[data-theme="light"]{
  --bg:var(--n-950); --surface:var(--n-1000); --surface-2:var(--n-900);
  --surface-3:var(--n-800); --border:var(--n-900); --border-strong:var(--n-700);
  --text:var(--n-0); --text-muted:var(--n-500);
  --accent-fill:var(--n-0); --accent-on:var(--n-1000);
  --glass:rgba(255,255,255,.74); --ripple:rgba(0,0,0,.14);
  --scrim:rgba(0,0,0,.34); --hl-bg:var(--n-0); --hl-fg:var(--n-1000);
}
html[data-theme="dark"]{
  --bg:var(--n-0); --surface:var(--n-100); --surface-2:var(--n-200);
  --surface-3:var(--n-300); --border:var(--n-300); --border-strong:var(--n-500);
  --text:var(--n-1000); --text-muted:var(--n-600);
  --accent-fill:var(--n-1000); --accent-on:var(--n-0);
  --glass:rgba(10,10,10,.66); --ripple:rgba(255,255,255,.18);
  --scrim:rgba(0,0,0,.62); --hl-bg:var(--n-1000); --hl-fg:var(--n-0);
}

/* ════════════════════════ RESET / BASE ════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-text-size-adjust:100%}
html[data-ts="l"]{font-size:19px}
html[data-ts="xl"]{font-size:21.5px}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);
  line-height:1.6;font-size:1rem;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--accent-fill);color:var(--accent-on)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
.skip{position:fixed;top:10px;left:10px;z-index:120;transform:translateY(-300%);
  background:var(--accent-fill);color:var(--accent-on);padding:10px 18px;
  border-radius:var(--r-sm);font-weight:600;transition:transform var(--d2)}
.skip:focus{transform:none}
/* [hidden] must always win over any component display rule — bug fix:
   .thumb-row{display:flex} was overriding the hidden attribute, so the
   screenshot row showed on load with a broken image icon. */
[hidden]{display:none!important}
html[lang="hi"] .hero-title,html[lang="hi"] h1,html[lang="hi"] .v-label{letter-spacing:0}

/* Icon slots (inline SVG injected by JS, consistent 1.75px stroke) */
[data-icon]{display:inline-flex;flex:none;width:20px;height:20px}
[data-icon] svg{width:100%;height:100%;display:block}

/* ════════════════════════ LAYOUT ════════════════════════ */
main{height:100dvh;overflow-y:auto;overscroll-behavior-y:none;position:relative;scroll-behavior:smooth}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  height:58px;padding:0 14px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-bottom:1px solid transparent;transition:border-color var(--d2)}
.topbar.scrolled{border-bottom-color:var(--border)}
.tb-mark{width:26px;height:26px;color:var(--text)}
.tb-title{font:700 1.05rem var(--font-display);letter-spacing:-.02em;opacity:0;
  transform:translateY(5px);transition:opacity var(--d2),transform var(--d2) var(--ease-spring)}
.topbar.scrolled .tb-title{opacity:1;transform:none}
.tb-spacer{flex:1}
.wrap{max-width:780px;margin:0 auto;padding:20px 18px 140px}
.screen{display:none}
.screen.active{display:block;animation:axisIn var(--d3) var(--ease-spring) both}
@keyframes axisIn{from{opacity:0;transform:translateX(calc(var(--ax,1)*26px))}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}

/* Sidebar (desktop ≥ 920px) */
.sidebar{display:none;position:fixed;top:0;left:0;bottom:0;width:252px;z-index:45;
  flex-direction:column;gap:4px;padding:20px 14px;background:var(--surface);
  border-right:1px solid var(--border)}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;
  font:800 1.15rem var(--font-display);letter-spacing:-.02em}
.side-brand [data-icon]{width:26px;height:26px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-item{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;white-space:nowrap;
  border:0;background:none;border-radius:var(--r-full);color:var(--text-muted);
  font:600 .95rem var(--font-ui);cursor:pointer;position:relative;overflow:hidden;
  transition:background var(--d1),color var(--d1)}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:var(--surface-2);color:var(--text)}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:12px 8px 4px}
.side-hint{font-size:.72rem;color:var(--text-muted);line-height:1.6}
/* Sidebar footer button: never wrap (bug fix: "How it works" wrapped
   onto two lines) */
.side-foot .btn{white-space:nowrap;justify-content:center}
.side-ver{font-size:.72rem;color:var(--text-muted)}

/* Bottom navigation (mobile) */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:46;display:flex;
  background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border-top:1px solid var(--border);padding:6px 6px calc(7px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:54px;padding:5px 0;border:0;background:none;cursor:pointer;
  color:var(--text-muted);font:600 .7rem var(--font-ui);transition:color var(--d1)}
.nav-item:active{transform:scale(.96)}
.nav-ic{position:relative;display:flex;align-items:center;justify-content:center;
  width:58px;height:30px}
.nav-ic::before{content:"";position:absolute;inset:4px 13px;border-radius:var(--r-full);
  background:transparent;transition:background var(--d2) var(--ease-spring)}
.nav-item.active{color:var(--text)}
.nav-item.active .nav-ic::before{background:var(--surface-3)}
.nav-ic [data-icon]{position:relative;width:22px;height:22px}

/* FAB (mobile, jump to Check) */
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:44;
  width:58px;height:58px;border-radius:18px;border:0;cursor:pointer;
  background:var(--accent-fill);color:var(--accent-on);box-shadow:var(--shadow-3);
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--d2) var(--ease-spring),opacity var(--d2)}
.fab:active{transform:scale(.9)}
.fab.hide{opacity:0;transform:scale(.5);pointer-events:none}
.fab [data-icon]{width:26px;height:26px}

/* ════════════════════════ CONTROLS ════════════════════════ */
/* Buttons: filled / tonal / outlined / text (Material style) */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;
  justify-content:center;gap:9px;height:48px;padding:0 20px;border-radius:var(--r-full);
  border:1.5px solid transparent;cursor:pointer;user-select:none;
  font:600 .92rem/1 var(--font-ui);-webkit-tap-highlight-color:transparent;
  transition:transform var(--d1) var(--ease-spring),background var(--d1),
  border-color var(--d1),opacity var(--d1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn [data-icon]{width:20px;height:20px}
.btn-filled{background:var(--accent-fill);color:var(--accent-on)}
.btn-tonal{background:var(--surface-2);color:var(--text)}
.btn-outline{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn-text{background:transparent;color:var(--text);padding:0 14px}
.btn-lg{height:54px;font-size:1rem}
.btn-block{width:100%}
.btn-inv{background:var(--accent-on);color:var(--accent-fill)}
.btn-inv-text{background:transparent;color:var(--accent-on);opacity:.85;
  text-decoration:underline;text-underline-offset:3px;height:44px}
.btn-inv-outline{background:transparent;border-color:currentColor;color:inherit;
  text-decoration:none;height:42px;font-size:.85rem}
.iconbtn{width:40px;height:40px;border-radius:var(--r-full);border:0;background:none;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text);transition:background var(--d1),transform var(--d1)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.92)}

/* Chips (assist + filter) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;overflow:hidden;height:40px;padding:0 15px;border-radius:var(--r-full);
  border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;font:500 .86rem var(--font-ui);
  color:var(--text);transition:transform var(--d1) var(--ease-spring),background var(--d1),color var(--d1)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill)}

/* Segmented control */
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-full);padding:4px;gap:2px}
.seg button{position:relative;overflow:hidden;border:0;background:transparent;cursor:pointer;
  height:40px;padding:0 14px;border-radius:var(--r-full);color:var(--text-muted);
  display:inline-flex;align-items:center;gap:7px;font:600 .86rem var(--font-ui);
  transition:color var(--d1),background var(--d2) var(--ease-spring)}
.seg button [data-icon]{width:17px;height:17px}
.seg button.on{background:var(--accent-fill);color:var(--accent-on)}

/* iOS-style toggle switch */
.switch{position:relative;width:52px;height:32px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.switch .trk{position:absolute;inset:0;border-radius:var(--r-full);background:var(--surface-3);
  border:1.5px solid var(--border-strong);
  transition:background var(--d2) var(--ease-spring),border-color var(--d2)}
.switch .thb{position:absolute;top:50%;left:3px;width:25px;height:25px;border-radius:50%;
  background:var(--n-1000);box-shadow:0 1px 3px rgba(0,0,0,.3);
  transform:translateY(-50%);
  transition:transform var(--d2) var(--ease-overshoot),background var(--d2)}
.switch input:checked ~ .trk{background:var(--accent-fill);border-color:var(--accent-fill)}
.switch input:checked ~ .thb{transform:translate(20px,-50%);background:var(--accent-on)}
.switch input:focus-visible ~ .trk{outline:2px solid var(--text);outline-offset:2px}

/* Text field with floating label (Material filled style) */
.field{position:relative;background:var(--surface-2);border:1.5px solid var(--border-strong);
  border-radius:var(--r-lg);transition:border-color var(--d1)}
.field:focus-within{border-color:var(--text)}
.field textarea{width:100%;min-height:150px;resize:vertical;border:0;background:transparent;
  color:var(--text);font:400 1rem/1.65 var(--font-ui);padding:26px 16px 14px;outline:none}
.field label{position:absolute;left:17px;top:18px;color:var(--text-muted);
  font:500 1rem var(--font-ui);pointer-events:none;transform-origin:left top;
  transition:transform var(--d2) var(--ease-spring),color var(--d2)}
.field:focus-within label,.field.has-value label{transform:translateY(-11px) scale(.72)}
.field.nudge{animation:nudge .4s var(--ease-spring)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-7px)}
  50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);box-shadow:var(--shadow-1)}

/* Ripple (monochrome) */
.ripple{position:absolute;border-radius:50%;background:var(--ripple);
  transform:scale(0);opacity:1;pointer-events:none;
  animation:rippleGrow .55s var(--ease-spring) forwards}
@keyframes rippleGrow{to{transform:scale(2.4);opacity:0}}

/* ════════════════════════ CHECK SCREEN ════════════════════════ */
.hero{padding:22px 0 24px;text-align:center}
.hero-logo{width:62px;height:62px;margin:0 auto 14px;border:1.5px solid var(--border-strong);
  border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;
  color:var(--text)}
.hero-logo [data-icon]{width:34px;height:34px}
.hero-title{font:800 clamp(2.2rem,7vw,3rem)/1.04 var(--font-display);letter-spacing:-.035em}
.hero-tag{margin:12px auto 0;max-width:44ch;color:var(--text-muted);font-size:1.02rem;line-height:1.65}
.check-card{padding:16px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-row .btn{flex:1 1 190px}
.thumb-row{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;
  background:var(--surface-2);border-radius:var(--r-md)}
.thumb-row img{width:54px;height:54px;object-fit:cover;border-radius:var(--r-sm)}
.thumb-meta{flex:1;min-width:0;display:grid;gap:2px}
.thumb-meta strong{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb-meta span{font-size:.8rem;color:var(--text-muted)}
.examples{margin-top:22px}
.ex-label{font:600 .8rem var(--font-ui);color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:10px}
#loadSlot,#inlineResult{margin-top:18px}
/* Desktop bug fix: scrollIntoView clipped the verdict behind the sticky
   58px topbar — scroll-margin-top keeps it fully visible. */
#inlineResult{scroll-margin-top:76px}

/* Loading skeleton */
.load-card{padding:20px;display:grid;gap:12px}
.sk-bar{height:15px;border-radius:8px;position:relative;overflow:hidden;background:var(--surface-2)}
.sk-bar::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--surface-3),transparent);
  animation:shimmer 1.15s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.load-status{display:flex;align-items:center;gap:10px;font:600 .92rem var(--font-ui);
  color:var(--text-muted)}
.spin{width:20px;height:20px;flex:none;border-radius:50%;
  border:2px solid var(--surface-3);border-top-color:var(--text);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ════════════════════════ RESULT ════════════════════════ */
.result{display:grid;gap:14px}
.result .card{padding:18px}
.res-card h3,.why-card h3{font:700 .98rem var(--font-ui);margin-bottom:10px}
.verdict{display:flex;align-items:center;gap:16px;padding:18px 20px;
  border-radius:var(--r-lg);border:1.5px solid var(--border-strong);background:var(--surface)}
.v-ic{width:54px;height:54px;flex:none;color:var(--text)}
.v-body{flex:1;min-width:0}
.v-label{font:500 clamp(1.4rem,5vw,1.85rem)/1.1 var(--font-display)}
.v-sub{font-size:.78rem;opacity:.72;margin-top:3px;font-weight:600}
.sev{display:flex;gap:5px;margin-top:8px}
.sev i{width:26px;height:6px;border-radius:3px;border:1.5px solid currentColor;opacity:.55}
/* Shape-coded verdicts — meaning never depends on color */
.v-safe{animation:fadeUp .45s var(--ease-spring) both}
.v-safe .sev i:first-child{background:currentColor;opacity:1}
.v-suspicious{border-width:2px;background:var(--surface-2);animation:fadeUp .45s var(--ease-spring) both}
.v-suspicious .v-label{font-weight:700}
.v-suspicious .sev i:nth-child(-n+2){background:currentColor;opacity:1}
.v-suspicious .v-ic{animation:pulse1 .65s .15s var(--ease-spring)}
@keyframes pulse1{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.v-scam{background:var(--accent-fill);color:var(--accent-on);border-color:var(--accent-fill);
  border-width:3px;animation:scamIn .55s var(--ease-spring) both}
.v-scam .v-label{font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.v-scam .sev i{background:currentColor;opacity:1}
.v-scam .v-ic{color:var(--accent-on)}
@keyframes scamIn{0%{opacity:0;transform:scale(.92)}38%{opacity:1;transform:scale(1.02)}
  55%{transform:translateX(-8px) scale(1)}72%{transform:translateX(5px)}
  86%{transform:translateX(-3px)}100%{transform:none}}
.v-sentence{font-size:1.02rem;line-height:1.65;padding:2px 4px}
/* Risk gauge */
.res-grid{display:grid;gap:14px}
.gauge-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 18px}
.gauge-wrap{position:relative;width:150px;height:150px}
.gauge-wrap svg{width:100%;height:100%}
.g-trk{fill:none;stroke:var(--surface-3);stroke-width:10}
.g-val{fill:none;stroke:currentColor;stroke-width:10;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;stroke-dasharray:326.73;
  stroke-dashoffset:326.73;transition:stroke-dashoffset 1s var(--ease-spring)}
.g-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.g-num{font:800 2.3rem/1 var(--font-display);letter-spacing:-.03em}
.g-den{font:600 .75rem var(--font-ui);color:var(--text-muted);margin-top:3px}
.g-lb{font:600 .78rem var(--font-ui);color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.07em;margin-top:6px}
.g-v{font:700 .95rem var(--font-ui);margin-top:2px}
/* Reasons */
.why-card ul{list-style:none}
.why-card li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--border)}
.why-card li:last-child{border-bottom:0;padding-bottom:2px}
.why-card li [data-icon]{width:22px;height:22px;margin-top:3px;color:var(--text)}
.why-card li span.wr{flex:1;font-size:.95rem;line-height:1.55}
.stagger>*{animation:fadeUp .4s var(--ease-spring) both;
  animation-delay:calc(var(--i,0)*70ms + 120ms)}
/* Links */
.link-row{padding:13px 0;border-bottom:1px solid var(--border)}
.link-row:last-child{border-bottom:0;padding-bottom:2px}
.link-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dom{font:600 .9rem var(--font-mono);word-break:break-all}
.dom .d{background:var(--hl-bg);color:var(--hl-fg);border-radius:4px;padding:0 3px;font-weight:700}
.dom .u{border-bottom:2px solid currentColor;font-weight:700}
.link-why{font-size:.88rem;color:var(--text-muted);line-height:1.55;margin-top:7px}
.vs{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.vs-l{display:block;font:700 .68rem var(--font-ui);letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
/* Verdict badges (history + links) */
.vb{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:var(--r-full);
  font:700 .68rem var(--font-ui);letter-spacing:.06em;text-transform:uppercase;flex:none}
.vb.safe{border:1.5px solid var(--border-strong);color:var(--text)}
.vb.suspicious{background:var(--surface-3);color:var(--text)}
.vb.scam{background:var(--accent-fill);color:var(--accent-on)}
/* Original message with inverted highlights */
.orig{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);
  border-radius:var(--r-md);padding:14px 16px;font-size:.95rem;line-height:1.75}
mark.hl{background:var(--hl-bg);color:var(--hl-fg);border-radius:5px;
  padding:0 4px;font-weight:700}
/* Advice steps */
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.step .n{width:30px;height:30px;border-radius:var(--r-full);flex:none;
  background:var(--accent-fill);color:var(--accent-on);
  display:flex;align-items:center;justify-content:center;font:700 .88rem var(--font-ui)}
.step .s-txt{flex:1;font-size:.95rem;line-height:1.6;align-self:center}
/* Result actions */
.res-actions{display:flex;flex-wrap:wrap;gap:10px}
.res-actions .btn{flex:1 1 170px}
.res-actions .btn-text{flex:0 0 auto}

/* ════════════════════════ HISTORY ════════════════════════ */
.scr-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:6px 0 16px}
.scr-head h1{font:700 1.55rem var(--font-display);letter-spacing:-.02em}
.scr-sub{color:var(--text-muted);margin:-8px 0 18px;font-size:.95rem;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px}
.stat .num{font:800 1.9rem/1 var(--font-display);letter-spacing:-.02em}
.stat .lb{color:var(--text-muted);font-size:.76rem;font-weight:600;margin-top:5px;
  line-height:1.35}
.filters{margin-bottom:14px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  cursor:pointer;position:relative;overflow:hidden;text-align:left;
  transition:transform var(--d1) var(--ease-spring),border-color var(--d1)}
.hrow:active{transform:scale(.985)}
.hrow.removing{animation:slideOut .28s var(--ease-spring) both}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.hmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.snip{font-size:.92rem;line-height:1.45;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.htime{font-size:.76rem;color:var(--text-muted);font-weight:500}
.hdel{flex:none;color:var(--text-muted)}
.empty{text-align:center;padding:38px 14px 20px}
.empty-art{width:132px;height:132px;margin:0 auto 12px;color:var(--text-muted)}
.empty-art svg{width:100%;height:100%}
.empty h2{font:700 1.25rem var(--font-display)}
.empty p{color:var(--text-muted);margin:8px auto 20px;max-width:34ch;line-height:1.6}

/* ════════════════════════ PROTECT ════════════════════════ */
.prot-card{display:flex;gap:14px;align-items:flex-start;padding:18px;margin-bottom:12px}
.pc-ic{width:44px;height:44px;border-radius:var(--r-md);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex:none}
.pc-ic [data-icon]{width:23px;height:23px}
.pc-main{flex:1;min-width:0}
.pc-main h3{font:700 1rem var(--font-ui)}
.pc-desc{color:var(--text-muted);font-size:.88rem;line-height:1.55;margin-top:3px}
.pc-status{display:flex;align-items:center;gap:7px;margin-top:10px;font:600 .8rem var(--font-ui)}
.pc-status .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text);flex:none}
.pc-status.on .dot{background:var(--text)}
.prot-card .switch{margin-top:6px}
.sim-card{padding:18px;margin-top:22px}
.sim-card h2{font:700 1.1rem var(--font-display);letter-spacing:-.01em}
.sim-card .scr-sub{margin:4px 0 0}
.btn-col{display:grid;gap:10px;margin-top:16px}
.btn-col .btn{justify-content:flex-start}

/* ════════════════════════ SETTINGS ════════════════════════ */
.set-card{padding:4px 18px;margin-bottom:14px}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.s-main{flex:1;min-width:0}
.s-main h3{font:600 .98rem var(--font-ui)}
.s-main p{color:var(--text-muted);font-size:.84rem;margin-top:2px;line-height:1.55}
.set-row .seg{flex:none}
.about-card{padding:18px}
.about-card h3{font:700 .98rem var(--font-ui);margin-bottom:8px}
.about-card p{font-size:.92rem;line-height:1.65;margin-bottom:8px}
.about-card .muted{color:var(--text-muted)}
.help-card{display:flex;align-items:center;gap:14px;background:var(--accent-fill);
  color:var(--accent-on);border-radius:var(--r-lg);padding:16px 18px;margin-top:12px}
.help-card [data-icon]{width:26px;height:26px}
.help-main{flex:1;display:grid}
.help-lb{font:600 .72rem var(--font-ui);text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.help-num{font:800 1.65rem/1.15 var(--font-display);letter-spacing:-.02em}

/* ════════════════════════ SHEETS / DIALOGS ════════════════════════ */
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim);opacity:0;
  pointer-events:none;transition:opacity var(--d2)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-3);
  transform:translateY(105%);transition:transform var(--d3) var(--ease-overshoot);
  max-height:88dvh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:translateY(0)}
.sheet-handle{padding:10px 0 6px;display:flex;justify-content:center;cursor:grab;
  touch-action:none;flex:none}
.sheet-handle i{width:42px;height:5px;border-radius:3px;background:var(--surface-3)}
.sheet-title-row{display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:2px 18px 8px;flex:none}
.sheet-title-row h3{font:700 1.1rem var(--font-display);letter-spacing:-.01em}
.sheet-body{overflow-y:auto;padding:0 18px 28px}
.how-l{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.how-l:last-of-type{border-bottom:0}
.how-l [data-icon]{width:24px;height:24px;margin-top:2px;flex:none}
.how-l h3{font:700 .95rem var(--font-ui)}
.how-l p{color:var(--text-muted);font-size:.9rem;line-height:1.6;margin-top:3px}
.how-priv{font-size:.84rem;color:var(--text-muted);background:var(--surface-2);
  border-radius:var(--r-md);padding:12px 14px;margin:6px 0 16px;line-height:1.6}
.dlg{position:fixed;inset:0;z-index:70;display:flex;align-items:center;
  justify-content:center;padding:24px;background:var(--scrim);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity var(--d2)}
.dlg.show{opacity:1;pointer-events:auto}
.dlg-box{background:var(--surface);border-radius:var(--r-xl);padding:24px;
  max-width:350px;width:100%;box-shadow:var(--shadow-3);transform:scale(.94);
  transition:transform var(--d2) var(--ease-overshoot)}
.dlg.show .dlg-box{transform:scale(1)}
.dlg-box h3{font:700 1.1rem var(--font-display);margin-bottom:8px}
.dlg-box p{color:var(--text-muted);font-size:.92rem;line-height:1.6;margin-bottom:20px}
.dlg-actions{display:flex;justify-content:flex-end;gap:6px}

/* ════════════════════════ SNACKBAR / TOASTS / BANNER ════════════════════════ */
.snackbar{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));
  z-index:85;max-width:min(92vw,480px);background:var(--accent-fill);color:var(--accent-on);
  padding:13px 20px;border-radius:var(--r-md);box-shadow:var(--shadow-3);
  font:600 .9rem var(--font-ui);text-align:center;opacity:0;
  transform:translate(-50%,16px);pointer-events:none;
  transition:opacity var(--d2),transform var(--d2) var(--ease-spring)}
.snackbar.show{opacity:1;transform:translate(-50%,0)}
.desk-toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;gap:12px;
  width:min(400px,calc(100vw - 32px));padding:14px 16px;background:var(--glass);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);
  transform:translateY(14px);opacity:0;pointer-events:none;
  transition:transform var(--d3) var(--ease-spring),opacity var(--d2)}
.desk-toast.show{transform:none;opacity:1;pointer-events:auto}
.dt-ic{width:22px;height:22px;margin-top:2px}
.dt-main{flex:1;min-width:0}
.dt-main p{font:600 .9rem var(--font-ui);line-height:1.5}
.dt-link{background:none;border:0;padding:7px 0 0;cursor:pointer;color:var(--text);
  font:700 .86rem var(--font-ui);text-decoration:underline;text-underline-offset:3px}
.sms-banner{position:fixed;top:0;left:0;right:0;z-index:75;display:flex;
  flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;
  transform:translateY(-130%);transition:transform var(--d3) var(--ease-overshoot)}
.sms-banner.show{transform:translateY(0)}
.sms-card{width:min(430px,100%);background:var(--glass);
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);
  padding:12px 14px;display:flex;gap:11px}
.sms-app-ic{width:38px;height:38px;border-radius:50%;flex:none;background:var(--accent-fill);
  color:var(--accent-on);display:flex;align-items:center;justify-content:center}
.sms-app-ic [data-icon]{width:19px;height:19px}
.sms-main{flex:1;min-width:0}
.sms-meta{display:flex;justify-content:space-between;gap:8px;font:600 .76rem var(--font-ui);
  color:var(--text-muted)}
.sms-sender{font:700 .9rem var(--font-ui);margin-top:1px}
.sms-body{font-size:.88rem;line-height:1.5;margin-top:2px;word-break:break-word}
.sms-warn{display:flex;gap:8px;align-items:center;margin-top:10px;padding:9px 12px;
  border-radius:var(--r-sm);background:var(--accent-fill);color:var(--accent-on);
  font:600 .82rem var(--font-ui);line-height:1.4}
.sms-warn [data-icon]{width:17px;height:17px}
.sms-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;width:min(430px,100%)}
.sms-actions .btn{height:40px;font-size:.84rem;padding:0 16px}

/* ════════════════════════ SCAM-SITE OVERLAY ════════════════════════ */
.scam-ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;
  justify-content:center;padding:22px;background:var(--scrim);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity var(--d2)}
.scam-ov.show{opacity:1;pointer-events:auto}
.ov-panel{background:var(--accent-fill);color:var(--accent-on);border-radius:var(--r-xl);
  padding:34px 26px;max-width:440px;width:100%;text-align:center;
  box-shadow:var(--shadow-3);transform:scale(.92);
  transition:transform var(--d3) var(--ease-overshoot)}
.scam-ov.show .ov-panel{transform:scale(1)}
.ov-ic{width:64px;height:64px;margin:0 auto 14px}
.ov-ic svg{width:100%;height:100%}
.ov-panel h2{font:800 1.5rem var(--font-display);letter-spacing:-.02em}
.ov-dom{font:700 .95rem var(--font-mono);display:inline-block;margin:12px 0 4px;
  border:1.5px solid currentColor;border-radius:var(--r-sm);padding:7px 13px;word-break:break-all}
.ov-body{font-size:.94rem;line-height:1.65;opacity:.86;margin:10px 0 22px}
.ov-actions{display:grid;gap:8px}

/* ════════════════════════ HERO EXTRAS ════════════════════════ */
.hero-cta{margin-top:16px}
.status-chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;
  margin-top:14px;border:1px solid var(--border-strong);border-radius:var(--r-full);
  background:var(--surface);font:600 .8rem var(--font-ui);color:var(--text)}
.status-chip [data-icon]{width:16px;height:16px;flex:none}
/* Read-aloud button: two icon slots, CSS toggles them */
.btn .ic-b{display:none}
.btn.speaking .ic-a{display:none}
.btn.speaking .ic-b{display:inline-flex}

/* ════════════════════════ DEMO STORY (full-screen stepper) ════════════════════════ */
.demo-ov{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:18px;opacity:0;
  pointer-events:none;transition:opacity var(--d2)}
.demo-ov.show{opacity:1;pointer-events:auto}
.demo-panel{width:min(560px,100%);max-height:100dvh;display:flex;flex-direction:column;
  transform:translateY(16px) scale(.98);opacity:.6;
  transition:transform var(--d3) var(--ease-overshoot),opacity var(--d2)}
.demo-ov.show .demo-panel{transform:none;opacity:1}
.demo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:2px 2px 14px;flex:none}
.demo-head h2{font:800 1.25rem var(--font-display);letter-spacing:-.02em}
.demo-scroll{overflow-y:auto;min-height:0}
.demo-card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow-2)}
.demo-step{display:none}
.demo-step.cur{display:block;animation:demoIn .45s var(--ease-spring) both}
.demo-step.cur.fromL{animation-name:demoInL}
@keyframes demoIn{from{opacity:0;transform:translateX(34px)}}
@keyframes demoInL{from{opacity:0;transform:translateX(-34px)}}
.demo-step h3{font:700 1.18rem var(--font-display);letter-spacing:-.01em;margin-bottom:8px}
.demo-step .d-body{color:var(--text-muted);line-height:1.7;font-size:.97rem}
.demo-avatar{width:86px;height:86px;border-radius:50%;background:var(--surface-2);
  border:1.5px solid var(--border-strong);display:flex;align-items:center;
  justify-content:center;margin:8px auto 18px}
.demo-avatar [data-icon]{width:44px;height:44px}
.demo-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.demo-tag{display:inline-flex;align-items:center;height:32px;padding:0 13px;
  border:1px solid var(--border-strong);border-radius:var(--r-full);
  font:600 .78rem var(--font-ui);background:var(--surface)}
/* Phone mock — step 2 */
.phone{max-width:330px;margin:18px auto 0;background:var(--surface);
  border:1.5px solid var(--border-strong);border-radius:var(--r-lg);overflow:hidden}
.phone-head{display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:var(--surface-2);font:600 .78rem var(--font-ui)}
.phone-body{padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start}
.bubble{background:var(--surface-2);border:1px solid var(--border);
  border-radius:4px 16px 16px 16px;padding:10px 13px;max-width:100%;
  font-size:.88rem;line-height:1.55;word-break:break-word}
.bubble b{display:block;font-size:.72rem;letter-spacing:.05em;color:var(--text-muted);
  margin-bottom:5px}
.bubble .b-time{display:block;font-size:.7rem;color:var(--text-muted);margin-top:5px}
/* Step 3 split view */
.demo-split{display:grid;grid-template-columns:1fr;gap:12px;margin-top:4px}
@media (min-width:560px){.demo-split{grid-template-columns:1fr 1fr}}
.split-card{background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px}
.split-h{display:flex;align-items:center;gap:9px;font:700 .92rem var(--font-ui);margin-bottom:12px}
.split-h [data-icon]{width:20px;height:20px;flex:none}
.split-list{list-style:none;display:grid;gap:10px;margin:0;padding:0}
.split-list li{display:flex;gap:10px;align-items:flex-start;font-size:.87rem;line-height:1.5}
.split-list li [data-icon]{width:17px;height:17px;flex:none;margin-top:2px}
.demo-verdict{padding:12px 14px;margin-bottom:12px}
.demo-verdict .v-ic{width:36px;height:36px}
.demo-verdict .v-label{font-size:1.2rem}
.demo-dots{display:flex;gap:6px;justify-content:center;padding-top:18px;flex:none}
.demo-dots button{width:30px;height:30px;border:0;background:none;cursor:pointer;
  border-radius:50%;display:flex;align-items:center;justify-content:center}
.demo-dots button i{width:8px;height:8px;border-radius:50%;background:var(--surface-3);
  transition:transform var(--d2) var(--ease-spring),background var(--d2)}
.demo-dots button.on i{background:var(--text);transform:scale(1.35)}
.demo-dots button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.demo-foot{display:flex;gap:10px;padding-top:14px;flex:none}
.demo-foot .btn{flex:1}
.rot-l{transform:rotate(90deg)}

/* ════════════════════════ TEST LAB ════════════════════════ */
.lab-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.lab-stat{background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:12px;text-align:center}
.lab-stat .num{font:800 1.6rem/1 var(--font-display);letter-spacing:-.02em}
.lab-stat .lb{color:var(--text-muted);font-size:.72rem;font-weight:600;margin-top:4px}
.lab-fail-head{font:700 .88rem var(--font-ui);margin:2px 0 10px}
.lab-row{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r-md);padding:11px 13px;
  margin-bottom:8px;font-size:.84rem;line-height:1.5}
.lab-row .vb{margin-top:1px}
.lab-row strong{display:block;margin-bottom:2px}
.lab-ok{display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;
  font:600 .88rem var(--font-ui)}
.lab-ok [data-icon]{width:19px;height:19px;flex:none}

/* ════════════════════════ BREAKPOINTS ════════════════════════ */
@media (min-width:920px){
  .bottom-nav,.fab,.topbar{display:none}
  .sidebar{display:flex}
  /* Bug fix: the content column was centered in the whole viewport, so it
     sat left-heavy with a gap on the right. Padding the scroll container
     by the sidebar width centers .wrap in the space RIGHT of the sidebar. */
  main{height:100dvh;padding-left:252px}
  .wrap{max-width:820px;padding:44px 40px 80px}
  .res-grid{grid-template-columns:280px 1fr;align-items:start}
  .snackbar{bottom:24px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,94vw);
    max-height:84vh;border-radius:var(--r-xl);
    transform:translate(-50%,-46%) scale(.95);opacity:0;
    transition:transform var(--d3) var(--ease-overshoot),opacity var(--d2)}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-handle{display:none}
  .sheet-title-row{padding-top:22px}
}

/* ════════════════════════ REDUCED MOTION ════════════════════════ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}
}
html[data-rm="1"] *,html[data-rm="1"] *::before,html[data-rm="1"] *::after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important}
</style>

/* ── 4 · URL extraction & helpers ──────────────────────────────────── */
const TLD_SRC = '(?:com|in|net|org|xyz|top|click|info|io|app|gov|edu|tk|ml|ga|cf|gq|me|co|biz|live|shop|online|site|link|icu|sbs|cfd|rest|quest|ly|gy|to|cc|ms|gg|be|tv|sbi)';
const URL_RE = new RegExp(
  '(?:https?://|www\\.)[^\\s<>"\u0060]+|(?:[a-z0-9][\\w-]*\\.)+' + TLD_SRC + '(?![\\w-])(?:/[^\\s<>"\u0060]*)?', 'gi');

function extractUrls(text) {
  const found = [];
  let m;
  URL_RE.lastIndex = 0;
  while ((m = URL_RE.exec(text)) !== null && found.length < 8) {
    if (m.index > 0 && text[m.index - 1] === '@') continue; /* email address */
    const url = m[0].replace(/[.,!?;:)\]]+$/, '');
    if (url.length > 4 && !found.includes(url)) found.push(url);
  }
  return found;
}
function urlHost(url) {
  try {
    let h = url.toLowerCase().replace(/^[a-z]+:\/\//, '').split('/')[0];
    const at = h.lastIndexOf('@');
    if (at > -1) h = h.slice(at + 1);
    h = h.split(':')[0];
    return h.replace(/^www\./, '') || h;
  } catch (e) { return ''; }
}

  if (REAL_DOMAINS.includes(host)) return host;
  for (const d of REAL_DOMAINS) if (host.endsWith('.' + d)) return d;
  return null;
}
function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

/* Is `host` a fake of a real bank/service/government domain?
   Order: punycode → real-domain-embedded-as-subdomain → brand token
   (raw spelling) → brand token (homoglyph-normalised) → typosquat
   (1–2 letter misspelling). Never fires for official domains.       */
function findLookalike(host) {
  if (realDomainOf(host)) return null;
  const labels = host.split('.');
  for (const l of labels) {
    if (l.indexOf('xn--') === 0) return { kind: 'punycode', real: null, brand: l };
  }
  /* real domain embedded inside a longer address: sbi.co.in.verify-kyc.top */
  for (const d of REAL_DOMAINS) {
    if (host.indexOf(d) > -1) return { kind: 'embedded', real: d, brand: d };
  }
  const passes = [null].concat(HOMOGLYPH_PASSES);
  for (const pass of passes) {
    for (const label of labels) {
      if (label.length < 3) continue;
      let form = label;
      if (pass) for (const pair of pass) form = form.split(pair[0]).join(pair[1]);
      const segs = form.split(/[^a-z0-9]+/).filter(Boolean);
      for (const bt of BRAND_TOKENS) {
        let hit = false;
        if (bt.mode === 'eq') hit = segs.indexOf(bt.tok) > -1;
        else if (bt.mode === 'seg') hit = segs.indexOf(bt.tok) > -1 || segs.some(function (s) { return s.indexOf(bt.tok) === 0; });
        else hit = segs.some(function (s) { return s.indexOf(bt.tok) > -1; });
        if (hit) return { kind: pass ? 'homoglyph' : 'lookalike', real: bt.real, brand: bt.tok };
      }
    }
  }
  /* 1–2 letter typosquat of a real domain: iciclbank.com, hdfcbnk.com */
  for (const label of labels) {
    if (label.length < 6 || label.length > 30 || /\d/.test(label)) continue;
    for (const d of REAL_DOMAINS) {
      const core = d.split('.').slice(0, -1).join('.');
      if (core.length >= 6 && levenshtein(label, core) <= 2) {
        return { kind: 'typo', real: d, brand: core };
      }
    }
  }
  return null;
}
function worstVerdict(a, b) {
  const order = { safe: 0, suspicious: 1, scam: 2 };
  return order[b] > order[a] ? b : a;
}

/* ── 5 · Link analysis (points feed the message score) ─────────────── */
function analyzeLink(url) {
  const host = urlHost(url);
  const out = { url, host, verdict: 'safe', reason: null, lookalike_of: null, pts: 0 };
  if (!host || host.indexOf('.') === -1) return out;
  const real = realDomainOf(host);
  if (real) {
    out.pts = -20;
    out.reason = { en: 'The link points to the real official website ' + host + '.',
                   hi: 'लिंक असली आधिकारिक वेबसाइट ' + host + ' पर जाता है।' };
    return out;
  }
  const look = findLookalike(host);
  const tld = host.split('.').pop();
  const isIP = /^\d{1,3}(?:\.\d{1,3}){3}$/.test(host);
  const isShort = SHORTENERS.has(host);
  const hyphens = (host.match(/-/g) || []).length;

  if (isIP) {
    out.pts += 30; out.verdict = 'scam';
    out.reason = { en: 'The link is just a raw number address (IP) — real banks never send these.',
                   hi: 'लिंक सिर्फ एक नंबर-पता (IP) है — असली बैंक कभी ऐसा पता नहीं भेजते।' };
  } else if (look) {
    if (look.kind === 'punycode') {
      out.pts += 30; out.verdict = 'scam';
      out.reason = { en: 'The link uses foreign-character (punycode) tricks to imitate a real website.',
                     hi: 'लिंक विदेशी-अक्षर (punycode) की चाल से असली वेबसाइट की नकल करता है।' };
    } else if (look.kind === 'embedded') {
      out.pts += 38; out.verdict = 'scam'; out.lookalike_of = look.real;
      out.reason = { en: 'The real website “' + look.real + '” is hidden inside a longer fake address — only the ending counts.',
                     hi: 'असली वेबसाइट “' + look.real + '” लंबे फर्ज़ी पते के अंदर छिपी है — असली पहचान पते के अंतिम हिस्से से होती है।' };
    } else if (!look.real) {
      out.pts += 26; out.verdict = 'scam';
      out.reason = { en: 'The address puts an official body (“' + look.brand.toUpperCase() + '”) inside a website that is not its official site.',
                     hi: 'पते में आधिकारिक निकाय (“' + look.brand.toUpperCase() + '”) का नाम है, पर वह उसकी आधिकारिक साइट नहीं है।' };
    } else {
      out.pts += 38; out.verdict = 'scam'; out.lookalike_of = look.real;
      if (look.kind === 'homoglyph' || look.kind === 'typo') {
        out.reason = { en: '“' + host + '” uses look-alike letters to imitate the real website “' + look.real + '”.',
                       hi: '“' + host + '” एक जैसे दिखने वाले अक्षरों से असली वेबसाइट “' + look.real + '” की नकल है।' };
      } else {
        out.reason = { en: 'The link “' + host + '” is a fake copy of the real website “' + look.real + '”.',
                       hi: 'लिंक “' + host + '” असली वेबसाइट “' + look.real + '” की नकल है।' };
      }
    }
  }
  if (isShort) {
    out.pts += 24; out.verdict = worstVerdict(out.verdict, 'suspicious');
    if (!out.reason) out.reason = { en: 'The link is shortened (' + host + ') to hide where it really leads.',
      hi: 'लिंक छोटा किया गया है (' + host + ') ताकि असली पता छिप जाए।' };
  } else if (BAD_TLDS.has(tld)) {
    out.pts += 24; out.verdict = worstVerdict(out.verdict, 'suspicious');
    if (!out.reason) out.reason = { en: 'The link ends in “.' + tld + '” — a cheap domain type that scammers often use.',
      hi: 'लिंक का अंत “.' + tld + '” में है — ऐसे सस्ते डोमेन अक्सर ठग इस्तेमाल करते हैं।' };
  }
  if (hyphens >= 2) {
    out.pts += 14; out.verdict = worstVerdict(out.verdict, 'suspicious');
    if (!out.reason) out.reason = { en: 'The address has many hyphens (' + host + ') — a trick to look official.',
      hi: 'पते में कई हाइफन (-) हैं (' + host + ') — आधिकारिक दिखने की चाल है।' };
  }
  if (/^http:\/\//i.test(url)) out.pts += 8;
  if (!out.reason) {
    out.pts += 4;
    out.reason = { en: 'An ordinary website link. Nothing obviously wrong, but stay alert if the message felt scary.',
      hi: 'सामान्य वेबसाइट लिंक। कुछ भी गलत नहीं दिखता — संदेश डरावना लगे तो सावधान रहें।' };
  }
  return out;
}

/* ── 7 · Small helpers ─────────────────────────────────────────────── */
function collectHits(re, text, cap) {
  re.lastIndex = 0;
  const hits = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    if (hits.indexOf(m[0]) === -1) hits.push(m[0]);
    if (hits.length >= (cap || 12)) break;
  }
  return hits;
}
function negatedBefore(text, idx, span) {
  const win = text.slice(Math.max(0, idx - (span || 55)), idx).toLowerCase();
  return NEG_BEFORE_RE.test(win);
}

/* ── 8 · Local rule-based detector (the offline brain) ─────────────── */
function detectLocal(rawText) {
  const text = String(rawText || '').slice(0, 4000);
  const low = text.toLowerCase();
  let score = 0;
  let hard = false;                       /* any HARD category fired */
  const groups = new Set();               /* distinct signal groups */
  const riskReasons = [];                 /* {icon,text_en,text_hi,rank} */
  const safeReasons = [];
  const highlights = [];
  const links = [];

  const addRisk = function (rank, icon, en, hi, hl) {
    riskReasons.push({ icon: icon, text_en: en, text_hi: hi, rank: rank });
    if (hl) for (let i = 0; i < hl.length; i++) if (hl[i]) highlights.push(String(hl[i]).slice(0, 60));
  };
  const addSafe = function (icon, en, hi) { safeReasons.push({ icon: icon, text_en: en, text_hi: hi }); };

  /* ---------- 1 · Links ---------- */
  const urls = extractUrls(text);
  let riskyLink = false;
  let sawRealDomain = false;
  for (let i = 0; i < urls.length; i++) {
    const la = analyzeLink(urls[i]);
    score += la.pts;
    links.push({
      url: la.url, verdict: la.verdict,
      reason: { en: la.reason.en, hi: la.reason.hi, text_en: la.reason.en, text_hi: la.reason.hi },
      lookalike_of: la.lookalike_of
    });
    if (la.verdict !== 'safe') {
      riskyLink = true;
      if (la.lookalike_of) {
        addRisk(0, 'link', la.reason.en, la.reason.hi, [la.host]);
      } else if (la.verdict === 'scam') {
        addRisk(0, 'link', la.reason.en, la.reason.hi, [la.host]);
      } else {
        addRisk(4, 'link', la.reason.en, la.reason.hi, [la.host]);
      }
    } else if (realDomainOf(la.host)) {
      sawRealDomain = true;
      addSafe('link', la.reason.en, la.reason.hi);
    }
  }
  if (riskyLink) groups.add('riskyLink');

  if (urls.length && text.replace(/\s+/g, ' ').trim().length <= urls[0].length + 12) {
    score += 10;
    addRisk(12, 'link', 'The message is only a link, with no explanation — be careful.',
      'संदेश सिर्फ एक लिंक है, कोई और जानकारी नहीं — सावधान रहें।');
  }

  /* ---------- 2 · Credential requests (negation-aware) ---------- */
  let credFired = false, credNegated = false;
  let m;
  RE_CRED_HARD.lastIndex = 0;
  while ((m = RE_CRED_HARD.exec(text)) !== null) {
    if (negatedBefore(text, m.index, 55)) { credNegated = true; continue; }
    /* "Enter this OTP in the app" next to a delivered code = instruction
       to yourself, not a scammer asking — skip when the verb is a
       self-action AND an OTP-to-you pattern is present. */
    const verb = (m[1] || '').toLowerCase();
    if (/^(enter|type|confirm)$/.test(verb.trim()) && OTP_TO_YOU_RE.test(text)) continue;
    hard = true; credFired = true;
    highlights.push(String(m[0]).slice(0, 40));
  }
  RE_CRED_HARD_HI.lastIndex = 0;
  while ((m = RE_CRED_HARD_HI.exec(text)) !== null) {
    /* Hindi negation may FOLLOW the verb ("OTP साझा न करें") — check both
       the matched span and a short window after it. */
    const after = text.slice(m.index + m[0].length, m.index + m[0].length + 14);
    if (NEG_BETWEEN_RE.test(m[0]) || /न\s*(?:करें|करना|देना|बताना|भेजना)|मत|नहीं|कभी/.test(after)) {
      credNegated = true; continue;
    }
    hard = true; credFired = true;
    highlights.push(String(m[0]).slice(0, 40));
  }
  if (credFired) {
    score += 30; groups.add('credential');
    addRisk(0, 'key', 'It asks you to share an OTP, PIN, CVV or UPI PIN — no real bank, app or government office will ever ask for these.',
      'यह आपसे OTP, PIN, CVV या UPI PIN मांगता है — कोई असली बैंक, ऐप या सरकारी दफ़्तर कभी नहीं मांगते।');
  } else {
    const softHits = collectHits(RE_CRED_SOFT, text, 3);
    const nfHits = collectHits(RE_CRED_NOUNFIRST, text, 3);
    const exHits = collectHits(RE_CRED_EXPIRE, text, 3);
    const updHits = collectHits(RE_CRED_UPDATE, text, 3);
    if (softHits.length) {
      score += 20; credFired = true;
      addRisk(1, 'key', 'It asks for KYC, Aadhaar, password or card/bank details — a classic phishing hook.',
        'यह KYC, आधार, पासवर्ड या कार्ड/बैंक की जानकारी मांगता है — फ़िशिंग की सबसे आम चाल।',
        softHits.slice(0, 2));
    }
    if (nfHits.length) {
      score += 20; credFired = true;
      addRisk(1, 'key', 'It pushes a “KYC/Aadhaar update” — banks never run KYC updates through message links.',
        'यह “KYC/आधार अपडेट” की बात करता है — बैंक कभी संदेश-लिंक से KYC अपडेट नहीं करवाते।',
        nfHits.slice(0, 2));
    }
    if (exHits.length && !credFired) {
      score += 20; credFired = true;
      addRisk(1, 'key', 'It says your OTP/KYC/Aadhaar has “expired” or is “pending” and pushes you to act — a standard phishing opener.',
        'यह कहता है कि आपका OTP/KYC/आधार “समाप्त” या “बाकी” है और जल्दी करने को दबाव बनाता है — फ़िशिंग की आम शुरुआत।',
        exHits.slice(0, 2));
    }
    if (updHits.length && !credFired) {
      score += 12; credFired = true;
      addRisk(1, 'key', 'It pushes you to “update/verify your details, payment or bill” through it — never do that from a message.',
        'यह आपको उसी संदेश से “जानकारी/भुगतान अपडेट या सत्यापित” करने पर मजबूर करता है — संदेश से ऐसा कभी न करें।',
        updHits.slice(0, 2));
    }
  }
  if (credFired) groups.add('credential');
  if (credNegated) {
    addSafe('key', 'It clearly tells you NOT to share the OTP or PIN — something only genuine senders say.',
      'इसमें साफ़ कहा गया है कि OTP/PIN किसी से साझा न करें — यह असली भेजने वाले ही कहते हैं।');
  }

  /* ---------- 3 · Impersonation ----------
     Brand names are matched on the message PROSE only — a brand inside
     a URL host is the link engine's job (official hosts must not raise
     an impersonation flag against themselves, e.g. onlinesbi.sbi). */
  let textNoLinks = text;
  for (let i = 0; i < urls.length; i++) textNoLinks = textNoLinks.split(urls[i]).join(' ');
  const lowNoLinks = textNoLinks.toLowerCase();
  const govHit = collectHits(RE_GOV_IMP, lowNoLinks, 1)[0];
  const consumerHit = collectHits(RE_CONSUMER_IMP, lowNoLinks, 1)[0];
  if (govHit) {
    score += 12; groups.add('impersonation');
    addRisk(3, 'bank', 'It speaks in the name of a bank or government body (“' + govHit.toUpperCase() + '”) — scammers hide behind big names.',
      'यह किसी बैंक या सरकारी विभाग (“' + govHit.toUpperCase() + '”) के नाम से आया है — ठग बड़े नाम के पीछे छिपते हैं।',
      [govHit]);
  } else if (consumerHit) {
    score += 6; groups.add('impersonation'); /* silent unless other risks */
  }

  /* ---------- 4 · Threats ---------- */
  const threatHits = collectHits(RE_THREAT, text, 6);
  const threatFired = threatHits.length > 0;
  if (threatFired) {
    score += Math.min(25, 16 + 3 * (threatHits.length - 1));
    groups.add('threat');
    addRisk(2, 'siren', 'It threatens you with arrest, legal action, seizure or SIM blocking — real authorities never warn like this over SMS.',
      'इसमें गिरफ़्तारी, कानूनी कार्रवाई, ज़ब्ती या SIM बंद करने की धमकी है — असली सरकारी अधिकारी कभी SMS में ऐसी चेतावनी नहीं देते।',
      threatHits.slice(0, 3));
  }

  /* ---------- 5 · Urgency / panic ---------- */
  const urgHits = collectHits(RE_URG, text, 6);
  const urgFired = urgHits.length > 0;
  if (urgFired) {
    score += Math.min(17, 9 + 2 * (urgHits.length - 1));
    groups.add('urgency');
    addRisk(5, 'clock', 'It creates panic with words like “' + urgHits.slice(0, 2).join('”, “') + '” so you act without thinking.',
      'यह “' + urgHits.slice(0, 2).join('”, “') + '” जैसे शब्दों से घबराहट पैदा करता है ताकि आप बिना सोचे-समझे कोई कदम उठाएँ।',
      urgHits.slice(0, 3));
  }

  /* ---------- 6 · Callback numbers & mobiles ---------- */
  const pressHits = collectHits(RE_PRESS, text, 2);
  const callHits = collectHits(RE_CALL_WORD, low, 2);
  const mobileHits = collectHits(RE_MOBILE, text, 3);
  const hasMobile = mobileHits.length > 0;
  let contactLink = false;
  for (let i = 0; i < urls.length; i++) {
    if (RE_CONTACT_LINK.test(urlHost(urls[i]))) { contactLink = true; break; }
    RE_CONTACT_LINK.lastIndex = 0;
  }
  const callbackFired = pressHits.length > 0 || ((callHits.length > 0 || contactLink) && hasMobile);
  if (pressHits.length) {
    score += 10; groups.add('callback');
    addRisk(9, 'phone', 'It tells you to press a key to “speak to an officer” — a classic call-back scam trick.',
      'यह किसी बटन दबाकर “अफ़सर से बात” करने को कहता है — कॉल-बैक घोटाले की पुरानी चाल।',
      pressHits.slice(0, 2));
  } else if (callbackFired) {
    score += 10; groups.add('callback');
    addRisk(9, 'phone', 'It pushes you to call or message an unknown number — real notices come through official channels, not private numbers.',
      'यह आपसे किसी अनजान नंबर पर कॉल या मैसेज कराना चाहता है — असली सूचनाएँ आधिकारिक रास्ते से आती हैं, निजी नंबरों से नहीं।',
      mobileHits.slice(0, 2));
  } else if (contactLink) {
    score += 10; groups.add('callback');
    addRisk(9, 'phone', 'It moves the chat to WhatsApp or Telegram — the favourite corner of scam gangs.',
      'यह बातचीत को WhatsApp या Telegram पर ले जाता है — ठगों का पसंदीदा ठिकाना।');
  }
  if (hasMobile) {
    score += 6; /* unsolicited personal mobile number in the text */
    highlights.push(mobileHits[0]);
  }

  /* ---------- 7 · Reward bait ---------- */
  const rewardHits = collectHits(RE_REWARD, text, 3);
  const rewardFired = rewardHits.length > 0;
  if (rewardFired) {
    score += 14; groups.add('reward');
    if (riskyLink || callbackFired || hasMobile) score += 8;
    addRisk(6, 'gift', 'It offers a prize or reward that is too good to be true — because it is.',
      'यह ऐसा इनाम या लॉटरी का लालच देता है जो सच हो ही नहीं सकता।',
      rewardHits.slice(0, 2));
  }

  /* ---------- 8 · Job / task bait ---------- */
  const jobHits = collectHits(RE_JOB, text, 3);
  const jobFired = jobHits.length > 0;
  if (jobFired) {
    score += 22; groups.add('job');
    addRisk(7, 'gift', 'It offers easy money — a part-time “liking videos” / “typing work” job. This is how task scams begin.',
      'यह आसान पैसे का लालच देता है — “वीडियो लाइक करने” / “टाइपिंग वर्क” वाली पार्ट-टाइम नौकरी। टास्क-घोटाला यहीं से शुरू होता है।',
      jobHits.slice(0, 2));
  }

  /* ---------- 9 · HARD scam categories ---------- */
  /* 9a · remote-control app */
  if (RE_REMOTE.test(low)) {
    hard = true; score += 30; groups.add('remote');
    addRisk(0, 'monitor', 'It asks you to install a remote-control app (AnyDesk, TeamViewer, QuickSupport…) — that hands your entire phone to a stranger. No real bank or officer ever asks this.',
      'यह आपसे रिमोट-कंट्रोल ऐप (AnyDesk, TeamViewer, QuickSupport…) इंस्टॉल करने को कहता है — इससे आपका पूरा फ़ोन किसी अजनबी के हाथ चला जाता है। कोई असली बैंक या अफ़सर कभी ऐसा नहीं कहता।');
  }
  /* 9b · instant-loan APK/fee funnel */
  RE_LOAN_APP.lastIndex = 0; RE_LOAN_APP2.lastIndex = 0;
  if (RE_LOAN_APP.test(low) || RE_LOAN_APP2.test(low)) {
    hard = true; score += 30; groups.add('loanApp');
    addRisk(0, 'siren', 'It promises instant approval with no documents, then pushes an APK or demands a processing fee. Real lenders do not collect fees this way.',
      'यह बिना दस्तावेज़ तुरंत लोन मंज़ूर होने का वादा करके APK या प्रोसेसिंग फीस माँगता है। असली लोनदाता ऐसे शुल्क नहीं लेते।');
  }
  /* 9b · "safe account" transfer */
  if (RE_SAFE_ACCT.test(low)) {
    hard = true; score += 30; groups.add('safeAccount');
    addRisk(0, 'siren', 'It wants you to move money to a “safe account” or RBI account — the signature trick of the “digital arrest” scam. No real authority ever parks your money like this.',
      'यह आपसे पैसे “सेफ खाते” या RBI खाते में डालने को कहता है — “डिजिटल अरेस्ट” घोटाले की पहचान यही है। कोई भी असली अधिकारी ऐसा कभी नहीं करता।');
  }
  /* 9c · digital arrest: authority + coercion */
  if (RE_DA_AUTH.test(low) && RE_DA_COERCE.test(low)) {
    hard = true; score += 30; groups.add('digitalArrest');
    addRisk(0, 'siren', 'This has the fingerprints of a “digital arrest” scam: a fake officer, a video call, secrecy and pressure. Police and agencies never work like this.',
      'इसमें “डिजिटल अरेस्ट” घोटाले के सारे निशान हैं: नकली अफ़सर, वीडियो कॉल, गोपनीयता और दबाव। पुलिस या कोई भी एजेंसी कभी ऐसे काम नहीं करती।');
  }
  /* 9d · sextortion / blackmail */
  if (RE_SEX_MEDIA.test(low) && RE_SEX_DEMAND.test(low)) {
    hard = true; score += 30; groups.add('sextortion');
    addRisk(0, 'chat', 'This is blackmail: it claims to have a private video or photos and demands money. Do not pay, do not reply — report it to the police or at cybercrime.gov.in.',
      'यह ब्लैकमेल है: निजी वीडियो या फोटो होने का दावा करके पैसे मांगे जा रहे हैं। न भुगतान करें, न जवाब दें — पुलिस या cybercrime.gov.in पर रिपोर्ट करें।');
  }
  /* 9e · task-scam funnel: job bait + private contact number */
  if (jobFired && hasMobile) {
    hard = true; score += 30; groups.add('funnel');
    addRisk(0, 'phone', 'It funnels you to a personal WhatsApp/Telegram number — exactly how “task scam” gangs recruit victims.',
      'यह आपको किसी निजी WhatsApp/Telegram नंबर तक ले जाता है — “टास्क स्कैम” गैंग शिकार यहीं से करते हैं।',
      mobileHits.slice(0, 1));
  }
  /* 9f · prize bait + documents/fee to "claim" */
  if (rewardFired && /(\b(?:send|share|upload|submit|pay|bhejo|bhej)\b[^.!?\n]{0,45}\b(?:aadhaar|aadhar|adhar|bank\s+details?|documents?|id\s+proof|fee|registration|processing)\b|(?:भेजें|साझा)[^.!?\n]{0,45}(?:आधार|कागज़ात|बैंक\s+विवरण))/i.test(low)) {
    hard = true; score += 30; groups.add('lotteryDocs');
    addRisk(0, 'key', 'A prize you never entered, asking for Aadhaar, bank details or a “fee” to claim it — that is the trap.',
      'जिस इनाम में आपने हिस्सा ही नहीं लिया, उसे पाने के लिए आधार, बैंक विवरण या “फ़ीस” मांगी जा रही है — यही जाल है।');
  }

  /* 9g · a KYC/OTP/details conversation pushed to WhatsApp or Telegram —
     real banks and government offices never verify customers there. */
  if (credFired && contactLink) {
    hard = true; score += 30; groups.add('credContact');
    addRisk(0, 'phone', 'It moves a KYC/OTP/details conversation to WhatsApp or Telegram — real banks and government offices never verify you there.',
      'यह KYC/OTP/जानकारी की बातचीत को WhatsApp या Telegram पर ले जाता है — असली बैंक या सरकारी दफ़्तर कभी वहीं सत्यापन नहीं करते।');
  }

  /* ---------- 10 · UPI refund / collect-request trick ---------- */
  const hasRefundWord = /\b(?:refund|रिफंड)\b/i.test(low);
  const hasPinAsk = credFired || /\bupi\s*pin\b|\benter\s+your\s+pin\b|pin\s+डाल/i.test(low);
  const hasCollect = /\bcollect\s+(?:request|money)\b|scan\s+(?:the\s+|this\s+)?(?:qr|code)\s+(?:to\s+)?(?:receive|get)|कलेक्ट\s+रिक्वेस्ट/i.test(low);
  if ((hasRefundWord && (hasPinAsk || hasCollect)) || hasCollect) {
    score += 18; groups.add('upiTrick');
    addRisk(1, 'key', 'It offers a “refund” that needs your UPI PIN, a QR scan or a collect request — money coming IN never needs a PIN.',
      'यह “रिफंड” देने के बहाने UPI PIN, QR स्कैन या कलेक्ट रिक्वेस्ट मांगता है — पैसे आने के लिए PIN कभी नहीं चाहिए।');
  }

  /* ---------- 11 · e-challan ---------- */
  const challanFired = RE_CHALLAN.test(low);
  RE_CHALLAN.lastIndex = 0;
  if (challanFired) {
    if (riskyLink || callbackFired) {
      score += 24; groups.add('challan');
      addRisk(0, 'link', 'A traffic e-challan that avoids the official government portal — real challans are only paid at echallan.parivahan.gov.in.',
        'ट्रैफ़िक ई-चालान जो आधिकारिक सरकारी पोर्टल से हटकर भुगतान मांगे — असली चालान सिर्फ़ echallan.parivahan.gov.in पर भरा जाता है।');
    } else if (sawRealDomain && !riskyLink) {
      addSafe('checkCircle', 'This is a genuine government challan notice pointing to the official parivahan website.',
        'यह सरकारी चालान की असली सूचना है जो आधिकारिक parivahan वेबसाइट पर ले जाती है।');
    }
  }

  /* ---------- 12 · Pending-payment pressure (soft, no group) ---------- */
  const pendHits = collectHits(RE_PENDING_PAY, text, 2);
  if (pendHits.length) {
    score += 10;
    addRisk(11, 'clock', 'It builds pressure over a “pending/due” bill or challan — pay only inside the official app or website.',
      'यह “बाकी/due” बिल या चालान का दबाव बनाता है — भुगतान सिर्फ़ आधिकारिक ऐप या वेबसाइट से करें।',
      pendHits.slice(0, 1));
  }

  /* ---------- 13 · Panic + private-number combo ---------- */
  if ((urgFired || threatFired) && (callbackFired || hasMobile)) {
    score += 15;
    addRisk(10, 'phone', 'First it creates panic, then it gives you a personal number to call — that combination is the scammer’s script.',
      'पहले घबराहट पैदा करता है, फिर कॉल के लिए निजी नंबर देता है — ठग की कहानी इसी क्रम में चलती है।');
  }

  /* ---------- 14 · SHOUTING ---------- */
  const capsWords = (text.match(/\b[A-Z]{3,}\b/g) || []).filter(function (w) { return !CAPS_OK.has(w); });
  const bangs = (text.match(/!/g) || []).length;
  if (capsWords.length >= 3 || bangs >= 3) {
    score += 6;
    addRisk(11, 'type', 'SHOUTING in CAPITAL LETTERS and warnings to create panic.',
      'पूरे CAPITALS में लिखकर घबराहट पैदा करने की कोशिश की गई है।', capsWords.slice(0, 4));
  }

  /* ---------- 15 · Genuine-message markers (negative weight) ---------- */
  if (NEG_SHARE_RE.test(low)) {
    score -= 12;
    addSafe('checkCircle', 'It clearly reminds you to keep your OTP/PIN private — a sign of a genuine message.',
      'यह याद दिलाता है कि OTP/PIN निजी रखें — असली संदेश की निशानी।');
  }
  if (RE_DELIVERY.test(low)) {
    score -= 8;
    addSafe('checkCircle', 'This is a routine delivery update about your own order.',
      'यह आपके ही ऑर्डर की आम डिलीवरी सूचना है।');
  }
  if (RE_NO_ACTION.test(low)) {
    score -= 8;
    addSafe('checkCircle', 'It explicitly says no action or no reply is needed — scam messages never do that.',
      'इसमें साफ़ कहा गया है कि कुछ करने या जवाब देने की ज़रूरत नहीं — घोटाले वाले संदेश ऐसा कभी नहीं कहते।');
  }
  if (!credFired && OTP_TO_YOU_RE.test(text)) {
    addSafe('key', 'This looks like a routine OTP or code sent TO you — nobody is asking you for one.',
      'यह आपको भेजा गया आम OTP या कोड लगता है — कोई आपसे मांग नहीं रहा।');
  }

  /* ---------- 16 · Combination logic & floors ---------- */
  /* ≥2 distinct groups  → +8   and score floored at 30 (suspicious)
     ≥3 distinct groups  → +14  (instead of +8)
     any HARD category   → score floored at 70 (scam)                */
  if (groups.size >= 2) score += groups.size >= 3 ? 14 : 8;
  if (groups.size >= 2) score = Math.max(score, 30);
  if (hard) score = Math.max(score, 70);
  score = Math.max(3, Math.min(100, Math.round(score)));

  /* ---------- 17 · Verdict + reasons ---------- */
  const verdict = score > 65 ? 'scam' : score >= 30 ? 'suspicious' : 'safe';
  let reasons;
  if (verdict === 'safe') {
    if (safeReasons.length === 0) {
      addSafe('checkCircle', 'No requests for money, OTP or personal details.', 'पैसे, OTP या निजी जानकारी की कोई मांग नहीं है।');
    }
    if (safeReasons.length === 1) {
      addSafe('checkCircle', 'No threatening or panic-creating language.', 'न धमकी है, न घबराहट पैदा करने वाली भाषा।');
    }
    if (safeReasons.length === 2) {
      addSafe('checkCircle', 'Nothing here pressures you to act quickly.', 'इसमें कहीं भी जल्दी करने का दबाव नहीं है।');
    }
    reasons = safeReasons.slice(0, 4);
  } else {
    if (!govHit && consumerHit && riskReasons.length) {
      addRisk(8, 'bank', 'It references “' + consumerHit.toUpperCase() + '” — scammers often imitate well-known companies.',
        'इसमें “' + consumerHit.toUpperCase() + '” का नाम है — ठग अक्सर मशहूर कंपनियों का नाटक करते हैं।');
    }
    riskReasons.sort(function (a, b) { return a.rank - b.rank; });
    reasons = riskReasons.slice(0, verdict === 'scam' ? 5 : 4);
    if (!reasons.length) {
      addRisk(5, 'alertTri', 'Something about this message felt off — treat it with caution.',
        'इस संदेश में कुछ गड़बड़ लगी — सावधानी से पेश आएँ।');
      reasons = riskReasons.slice(0, 3);
    }
  }

  /* ---------- 18 · Highlights (dedupe, sane lengths) ---------- */
  const seen = new Set();
  const hl = highlights
    .map(function (h) { return String(h).trim(); })
    .filter(function (h) { return h.length >= 3 && h.length <= 60 && !/[<>&"]/.test(h); })
    .filter(function (h) { const k = h.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, 10);

  return { verdict: verdict, score: score, reasons: reasons, links: links, advice: ADVICE[verdict], highlights: hl };
}

/* ── 9 · Single entry point — API first, offline fallback always ───── */
async function analyze(input) {
  const text = String(input || '').slice(0, 4000);
  if (API_BASE) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(String(API_BASE).replace(/\/$/, '') + '/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !['safe', 'suspicious', 'scam'].includes(data.verdict) ||
          typeof data.score !== 'number' || !Array.isArray(data.reasons)) {
        throw new Error('Unexpected response shape');
      }
      return {
        verdict: data.verdict,
        score: Math.max(0, Math.min(100, Math.round(data.score))),
        reasons: data.reasons.slice(0, 5),
        links: Array.isArray(data.links) ? data.links : [],
        advice: Array.isArray(data.advice) ? data.advice : ADVICE[data.verdict],
        highlights: Array.isArray(data.highlights) ? data.highlights : []
      };
    } catch (err) {
      console.warn('[Shadow] API unavailable, using offline detector:', err.message);
    }
  }
  await sleep(1000); /* demo scanning delay for the local detector */
  return detectLocal(text);
}

/* Highlight risky words in the original message (inverted marker style). */
function highlightHtml(text, hls) {
  const base = esc(text);
  const alts = Array.from(new Set((hls || []).map(h => String(h).trim())))
    .filter(h => h.length >= 3 && h.length <= 60 && !/[<>&"']/.test(h))
    .sort((a, b) => b.length - a.length)
    .slice(0, 10);
  if (!alts.length) return base;
  try {
    const re = new RegExp('\\b(?:' + alts.map(escRe).join('|') + ')\\b', 'gi');
    return base.replace(re, w => '<mark class="hl">' + w + '</mark>');
  } catch (e) { return base; }
}
/* Visual domain diff: shared prefix normal, differing tail marked. */
function diffHtml(shown, ref, cls) {
  const s = String(shown), r = String(ref);
  let i = 0;
  while (i < s.length && i < r.length && s[i] === r[i]) i++;
  return esc(s.slice(0, i)) + (i < s.length ? '<span class="' + cls + '">' + esc(s.slice(i)) + '</span>' : '');
}

/* ---- Result view ---------------------------------------------------- */
function buildResultNode(r, text) {
  const MAP = {
    safe:       { cls: 'v-safe',       icon: 'checkCircle', label: t('v_safe'), sev: 1, sent: t('sent_safe') },
    suspicious: { cls: 'v-suspicious', icon: 'halfRing',    label: t('v_susp'), sev: 2, sent: t('sent_susp') },
    scam:       { cls: 'v-scam',       icon: 'octaX',       label: t('v_scam'), sev: 3, sent: t('sent_scam') }
  };
  const V = MAP[r.verdict] || MAP.safe;
  const L = state.lang;
  const pickTxt = o => (L === 'hi' ? (o && (o.text_hi || o.text_en)) : (o && (o.text_en || o.text_hi))) || '';
  const el = document.createElement('div');
  el.className = 'result';
  el.setAttribute('role', 'article');

  let html = '';
  /* Verdict block — shape-coded, never color-only */
  html += '<div class="verdict ' + V.cls + '"><span class="v-ic" data-icon="' + V.icon + '"></span>' +
    '<div class="v-body"><div class="v-label">' + esc(V.label) + '</div>' +
    '<div class="sev" aria-hidden="true"><i></i><i></i><i></i></div>' +
    '<div class="v-sub">' + esc(t('sev_fmt', V.sev)) + '</div></div></div>';
  html += '<p class="v-sentence">' + esc(V.sent) + '</p>';

  /* Gauge + reasons */
  html += '<div class="res-grid">' +
    '<div class="card gauge-card"><div class="gauge-wrap">' +
    '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="g-trk" cx="60" cy="60" r="52"/><circle class="g-val" cx="60" cy="60" r="52"/></svg>' +
    '<div class="g-center"><div class="g-num" data-count>0</div><div class="g-den">/ 100</div></div></div>' +
    '<div class="g-lb">' + esc(t('score_label')) + '</div><div class="g-v">' + esc(V.label) + '</div></div>' +
    '<div class="card why-card"><h3>' + esc(t('why_title')) + '</h3><ul class="stagger">' +
    (r.reasons || []).map((x, i) =>
      '<li style="--i:' + i + '"><span data-icon="' + esc(x.icon || 'info') + '"></span>' +
      '<span class="wr">' + esc(pickTxt(x)) + '</span></li>').join('') +
    '</ul></div></div>';

  /* Links with mini verdicts + lookalike comparison */
  if (r.links && r.links.length) {
    html += '<div class="card res-card"><h3>' + esc(t('links_title')) + '</h3>' +
      r.links.map(l => {
        const vbc = l.verdict === 'scam' ? 'scam' : l.verdict === 'suspicious' ? 'suspicious' : 'safe';
        const vlbl = { scam: t('v_scam'), suspicious: t('v_susp'), safe: t('v_safe') }[l.verdict] || '';
        let row = '<div class="link-row"><div class="link-head">' +
          '<span class="vb ' + vbc + '">' + esc(vlbl) + '</span>' +
          '<span class="dom">' + esc(l.url) + '</span></div>';
        const reason = l.reason ? (typeof l.reason === 'string' ? l.reason : pickTxt(l.reason)) : '';
        if (reason) row += '<p class="link-why">' + esc(reason) + '</p>';
        if (l.lookalike_of) {
          const host = urlHost(l.url);
          row += '<div class="vs">' +
            '<div><span class="vs-l">' + esc(t('vs_msg')) + '</span><span class="dom">' + diffHtml(host, l.lookalike_of, 'd') + '</span></div>' +
            '<div><span class="vs-l">' + esc(t('vs_real')) + '</span><span class="dom">' + diffHtml(l.lookalike_of, host, 'u') + '</span></div>' +
            '</div>';
        }
        return row + '</div>';
      }).join('') + '</div>';
  }

  /* Original message with inline highlights */
  if (r.highlights && r.highlights.length) {
    html += '<div class="card res-card"><h3>' + esc(t('msg_title')) + '</h3>' +
      '<blockquote class="orig">' + highlightHtml(text, r.highlights) + '</blockquote></div>';

    (r.advice || []).map((a, i) =>

      '<span class="s-txt">' + esc(pickTxt(a)) + '</span></div>').join('') +
    '</div></div>';

  /* Actions — native share (or copy + WhatsApp fallback), read aloud,
     report, again */
  const canShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function';
  html += '<div class="res-actions">';
  html += canShare
    ? '<button class="btn btn-tonal" type="button" data-act="share"><span data-icon="chat"></span><span>' + esc(t('share_t')) + '</span></button>'
    : '<button class="btn btn-tonal" type="button" data-act="copy"><span data-icon="copy"></span><span>' + esc(t('act_copy')) + '</span></button>' +
      '<button class="btn btn-outline" type="button" data-act="wa"><span data-icon="chat"></span><span>' + esc(t('share_wa')) + '</span></button>';
  html += '<button class="btn btn-outline" type="button" data-act="speak" aria-pressed="false">' +
    '<span class="ic-a" data-icon="speaker"></span><span class="ic-b" data-icon="stop"></span>' +
    '<span class="sp-lb">' + esc(t('read_t')) + '</span></button>';

  html += '<button class="btn btn-text" type="button" data-act="again"><span>' + esc(t('act_again')) + '</span></button>';
  html += '</div>';

  el.innerHTML = html;
  injectIcons(el);
  return el;
}

function countUp(el, to, ms) {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function runResultFx(node, r) {
  const val = node.querySelector('.g-val');
  const num = node.querySelector('[data-count]');
  const C = 2 * Math.PI * 52;
  if (val) {
    const target = C * (1 - Math.max(0, Math.min(100, r.score)) / 100);
    requestAnimationFrame(() => requestAnimationFrame(() => { val.style.strokeDashoffset = target; }));
  }
  if (num) {
    if (rmActive()) num.textContent = r.score;
    else countUp(num, r.score, 900);
  }
}
/* Modal sheet on mobile, inline panel on desktop. */
function presentResult(result, text) {
  stopSpeak();
  state.lastResult = result;
  state.lastText = text;
  const node = buildResultNode(result, text);
  if (mqDesk.matches) {
    state.resultLoc = 'inline';
    $('#slotResult').replaceChildren();
    $('#inlineResult').replaceChildren(node);
    requestAnimationFrame(() => runResultFx(node, result));
    $('#inlineResult').scrollIntoView({ behavior: rmActive() ? 'auto' : 'smooth', block: 'start' });
  } else {
    state.resultLoc = 'sheet';
    $('#inlineResult').replaceChildren();
    $('#slotResult').replaceChildren(node);
    openSheet($('#sheetResult'));
    requestAnimationFrame(() => runResultFx(node, result));
  }
}
function clearResult(focus) {
  stopSpeak();
  state.lastResult = null;
  state.lastText = '';
  state.resultLoc = null;
  $('#inlineResult').replaceChildren();
  $('#slotResult').replaceChildren();
  if ($('#sheetResult').classList.contains('open')) closeSheet($('#sheetResult'));
  if (focus) {
    const ta = $('#msgInput');
    ta.value = '';
    $('#fieldMsg').classList.remove('has-value');
    $('#main').scrollTo({ top: 0, behavior: rmActive() ? 'auto' : 'smooth' });
    setTimeout(() => ta.focus(), 300);
  }
}
function rerenderResult() {
  if (!state.lastResult) return;
  const inlineHas = $('#inlineResult').children.length > 0;
  const sheetOpen = $('#sheetResult').classList.contains('open');
  if (inlineHas || sheetOpen) presentResult(state.lastResult, state.lastText);
}

/* ---- Check flow ------------------------------------------------------ */
let checking = false;
async function runCheck() {
  if (checking) return;
  const ta = $('#msgInput');
  const text = ta.value.trim();
  if (!text) {
    const f = $('#fieldMsg');
    f.classList.remove('nudge'); void f.offsetWidth; f.classList.add('nudge');
    snack(t('err_empty'));
    ta.focus();
    return;
  }
  checking = true;
  $('#btnCheck').disabled = true;
  clearResult(false);
  const load = renderLoading();
  $('#loadSlot').replaceChildren(load);
  try {
    const result = await analyze(text);
    if (load._stop) load._stop();
    $('#loadSlot').replaceChildren();
    presentResult(result, text);
    addHistory(text, result);
  } catch (err) {
    if (load._stop) load._stop();
    $('#loadSlot').replaceChildren();
    snack(t('err_generic'));
  }
  $('#btnCheck').disabled = false;
  checking = false;
}
function loadAndCheck(text) {
  switchScreen('check');
  $('#msgInput').value = text;
  $('#fieldMsg').classList.add('has-value');
  runCheck();
}

function buildWarning() {

  if (!r) return '';
  const L = state.lang;
  const vWord = { safe: t('v_safe'), suspicious: t('v_susp'), scam: t('v_scam') }[r.verdict];
  const pick = o => (L === 'hi' ? (o.text_hi || o.text_en) : (o.text_en || o.text_hi));

    ? 'चेतावनी (Shadow): यह संदेश “' + vWord + '” पाया गया — जोखिम स्कोर ' + r.score + '/100।'
    : 'WARNING (Shadow): this message was checked and looks ' + vWord + ' — risk score ' + r.score + '/100.');
  W.push(L === 'hi' ? 'क्यों:' : 'Why:');
  (r.reasons || []).slice(0, 4).forEach(x => W.push('• ' + pick(x)));
  W.push(L === 'hi' ? 'क्या करें:' : 'What to do:');

  W.push(L === 'hi' ? '— Shadow से जाँचा गया' : '— Checked with Shadow');
  return W.join('\n');

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    try {
      const x = document.createElement('textarea');
      x.value = txt;
      x.style.cssText = 'position:fixed;top:-999px;opacity:0';
      document.body.appendChild(x);
      x.select();
      const ok = document.execCommand('copy');
      x.remove();
      return ok;
    } catch (e2) { return false; }
  }
}
async function pasteFromClipboard() {
  try {
    const txt = await navigator.clipboard.readText();
    if (!txt || !txt.trim()) throw new Error('empty');
    $('#msgInput').value = txt.trim().slice(0, 4000);
    $('#fieldMsg').classList.add('has-value');
    snack(t('pasted'));
  } catch (e) { snack(t('paste_fail')); }
}
function onFileChosen(e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const img = $('#thumbImg');
  if (img.src && img.src.indexOf('blob:') === 0) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(f);
  $('#thumbName').textContent = f.name;
